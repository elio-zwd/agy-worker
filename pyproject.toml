[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elio-agy-worker"
version = "0.3.3"
description = "Codex 经 MCP 调度本地 AGY 的任务执行器"
requires-python = ">=3.13,<3.15"
dependencies = ["mcp==2.2.0", "pydantic==2.13.5", "pywin32==312", "tomlkit==0.15.1", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
